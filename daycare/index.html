const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(ENC.iv)},key,u8(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  try{
    const html=await unlock(pw);
    try{sessionStorage.setItem('tdhq-daycare',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(!silent){document.getElementById('err').textContent='That\u2019s not it \u2014 try again.';document.getElementById('pw').select();}
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value.trim().toLowerCase(),false);});
try{const s=sessionStorage.getItem('tdhq-daycare'); if(s) go(s,true);}catch(e){}
</script>
